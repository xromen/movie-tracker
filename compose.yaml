name: movie-tracker

services:
  frontend:
    image: movie-tracker-web:production
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: movie-tracker-web
    environment:
      MOVIE_TRACKER_API_URL: http://api:${PORT:-8080}/api
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${NEXT_PUBLIC_APP_URL:-http://localhost:3000}}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    image: movie-tracker-api:production
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: movie-tracker-api
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8080}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-movietracker}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-15s}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-https://api.themoviedb.org/3}
      TMDB_IMAGES_BASE_URL: ${TMDB_IMAGES_BASE_URL:-https://api.themoviedb.org}
      TMDB_BEARER_TOKEN: ${TMDB_BEARER_TOKEN:-}
      TMDB_TIMEOUT: ${TMDB_TIMEOUT:-10s}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_DISABLED: ${REDIS_DISABLED:-false}
      LOG_FILE_PATH: /var/log/movie-tracker/api.log
    volumes:
      - api_logs:/var/log/movie-tracker
    ports:
      - "127.0.0.1:${API_PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: movie-tracker-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
      nginx-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: movie-tracker-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: movie-tracker-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: movie-tracker-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
      - api_logs:/var/log/movie-tracker:ro
      - /var/log/nginx:/var/log/nginx:ro
    depends_on:
      loki:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: movie-tracker-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: movie-tracker-nginx-exporter
    command:
      - --nginx.scrape-uri=http://127.0.0.1/nginx_status
    network_mode: host
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: movie-tracker-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-movietracker}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: movie-tracker-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD"
        else
          redis-server
        fi
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  api_logs:
  grafana_data:
  loki_data:
  postgres_data:
    external: true
    name:  movie-tracker-go_postgres_data
  prometheus_data:
  promtail_positions:
