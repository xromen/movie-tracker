# Include this file in the host nginx configuration and reload nginx.
# Example:
#   include /path/to/movie-tracker/deploy/nginx/monitoring.conf;

server {
    listen 127.0.0.1:8081;
    server_name localhost;

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
