server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: movie-tracker-api
    static_configs:
      - targets: ["localhost"]
        labels:
          job: movie-tracker-api
          service: api
          __path__: /var/log/movie-tracker/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: msg
            trace_id: trace_id
            method: method
            path: path
            status: status
            latency_ms: latency_ms
            time: time
      - labels:
          level:
          method:
          status:
      - timestamp:
          source: time
          format: RFC3339Nano

  - job_name: nginx-access
    static_configs:
      - targets: ["localhost"]
        labels:
          job: nginx
          service: nginx
          log_type: access
          __path__: /var/log/nginx/access.log

  - job_name: nginx-error
    static_configs:
      - targets: ["localhost"]
        labels:
          job: nginx
          service: nginx
          log_type: error
          __path__: /var/log/nginx/error.log
