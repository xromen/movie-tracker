global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: movie-tracker-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: movie-tracker-web
    metrics_path: /api/metrics
    static_configs:
      - targets: ["frontend:3000"]

  - job_name: nginx
    static_configs:
      - targets: ["host.docker.internal:9113"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]
