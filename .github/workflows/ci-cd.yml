name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movie-tracker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
        env:
          MOVIE_TRACKER_API_URL: http://localhost:8080/api
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

  compose:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs:
      - web
      - api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services
        run: docker compose build
        env:
          TMDB_BEARER_TOKEN: test-token
          JWT_SECRET: test-secret
          DB_PASSWORD: test-password

  deploy:
    name: Deploy
    runs-on: [self-hosted, linux, x64]
    needs: compose
    if: github.event_name != 'pull_request'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build and start stack
        run: docker compose up --build --detach --remove-orphans --profile frontend

      - name: Check stack health
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "http://127.0.0.1:${WEB_PORT}/login" > /dev/null \
              && curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/api/health/live" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
        env:
          WEB_PORT: ${{ vars.WEB_PORT || '3000' }}
          API_PORT: ${{ vars.API_PORT || '8080' }}
